{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – MedConnect Healthcare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2.5">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=2.5">
</head>
<body class="auth-body">

    <div class="auth-card-wrapper">
        <div class="card auth-card">
            
            <div class="auth-header text-center">
                <a href="{% url 'dashboard' %}" class="auth-brand">
                    <i class="fa-solid fa-staff-snake"></i>
                    <span>MedConnect</span>
                </a>
                <h3>Create New Account</h3>
                <p class="text-muted">Register to order medicines and track deliveries</p>
            </div>

            {% if messages %}
            <div class="auth-messages">
                {% for message in messages %}
                <div class="alert-banner alert-{{ message.tags }}">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'register' %}" class="auth-form">
                {% csrf_token %}

                <div class="form-group mb-3">
                    <label class="form-label">Full Name</label>
                    <div class="auth-input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="name" class="form-input" placeholder="Dr. Jane Doe" required>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="auth-input-wrap">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" name="email" class="form-input" placeholder="jane@example.com" required>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label">Phone Number</label>
                    <div class="auth-input-wrap">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text" name="phone" class="form-input" placeholder="+1 (555) 123-4567" required>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label class="form-label">Password</label>
                    <div class="auth-input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" class="form-input" placeholder="At least 6 characters" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fa-solid fa-user-plus"></i> Complete Registration
                </button>
            </form>

            <div class="auth-footer text-center mt-4">
                <p class="text-muted small">Already have an account? <a href="{% url 'login' %}" class="text-teal font-bold">Sign In</a></p>
            </div>

        </div>
    </div>

</body>
</html>
