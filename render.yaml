services:
  - type: web
    name: medconnect-healthcare
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn medconnect_project.wsgi:application"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: medconnect_db
      - key: GOOGLE_MAPS_API_KEY
        sync: false
